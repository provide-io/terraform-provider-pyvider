name: 🚀 Release Provider

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Exact successful build workflow run ID for this commit
        required: true
        type: string
      prerelease:
        description: Is this a pre-release?
        required: false
        type: boolean
        default: false

env:
  PYTHON_VERSION: '3.11'
  PYTHONIOENCODING: utf-8

jobs:
  validate-build:
    name: 🔒 Validate exact build run
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      build_run_id: ${{ steps.validate.outputs.build_run_id }}
      release_target_sha: ${{ steps.validate.outputs.release_target_sha }}
    steps:
      - name: Validate numeric run and exact release commit
        id: validate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          RELEASE_TARGET_SHA: ${{ github.sha }}
        run: |
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'build_run_id must be numeric' >&2; exit 2; }
          [[ "$RELEASE_TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'github.sha must be a full commit SHA' >&2; exit 2; }
          run_json=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BUILD_RUN_ID}")
          test "$(jq -r .path <<<"$run_json")" = ".github/workflows/build-provider.yml"
          test "$(jq -r .conclusion <<<"$run_json")" = "success"
          headSha=$(jq -r .head_sha <<<"$run_json")
          test "$headSha" = "$RELEASE_TARGET_SHA"
          artifacts=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BUILD_RUN_ID}/artifacts")
          for required in \
            provider-linux_amd64 provider-linux_arm64 provider-darwin_amd64 \
            provider-darwin_arm64 provider-windows_amd64 provider-linting-proof; do
            jq -e --arg name "$required" '.artifacts[] | select(.name == $name and .expired == false)' \
              <<<"$artifacts" >/dev/null
          done
          echo "build_run_id=$BUILD_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "release_target_sha=$RELEASE_TARGET_SHA" >> "$GITHUB_OUTPUT"

  release:
    name: 🎉 Publish exact-SHA release
    needs: validate-build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: 📥 Checkout exact release target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.validate-build.outputs.release_target_sha }}

      - name: 📖 Read version
        id: version
        shell: bash
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: 📥 Download all artifacts from the validated run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: artifacts
          run-id: ${{ needs.validate-build.outputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📁 Stage release archives and proof assets
        shell: bash
        run: |
          mkdir release
          find artifacts/provider-* -maxdepth 1 -name 'terraform-provider-pyvider_*.zip' \
            -type f -exec cp {} release/ \;
          for name in \
            provider-linting-proof.json \
            provider-linting-opentofu.cast \
            provider-linting-direct.cast \
            provider-linting-walkthrough.cast \
            provider-linting-build-provenance.json; do
            cp "artifacts/provider-linting-proof/$name" "release/$name"
          done
          cp terraform-registry-manifest.json \
            "release/terraform-provider-pyvider_${{ steps.version.outputs.version }}_manifest.json"
          for target in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64 windows_amd64; do
            test -f "release/terraform-provider-pyvider_${{ steps.version.outputs.version }}_${target}.zip"
          done

      - name: 🔧 Generate release checksums
        shell: bash
        run: |
          cd release
          sha256sum * > "terraform-provider-pyvider_${{ steps.version.outputs.version }}_SHA256SUMS"
          sha256sum -c "terraform-provider-pyvider_${{ steps.version.outputs.version }}_SHA256SUMS"

      - name: 🔐 Sign and verify checksums
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          test -n "$GPG_PRIVATE_KEY"
          test -n "$GPG_KEY_ID"
          .github/scripts/sign-release.sh release
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --verify \
            "release/terraform-provider-pyvider_${{ steps.version.outputs.version }}_SHA256SUMS.sig" \
            "release/terraform-provider-pyvider_${{ steps.version.outputs.version }}_SHA256SUMS"

      - name: 🎉 Publish release at the validated SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TARGET_SHA: ${{ needs.validate-build.outputs.release_target_sha }}
        run: ci/publish-release.sh "${{ steps.version.outputs.version }}"

  verify-release-proof:
    name: 🔎 verify-release-proof
    needs: [validate-build, release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout exact released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.validate-build.outputs.release_target_sha }}

      - name: 🐍 Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install UV and released TofuSoup
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      - run: |
          uv sync --frozen --group dev
          uv tool install --refresh tofusoup==0.8.2
          test "$(soup --version)" = "soup, version 0.8.2"
          uv run python -c 'import tofusoup; assert tofusoup.__version__ == "0.8.2"'

      - name: 📥 Download immutable release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir released
          gh release download "v${{ needs.release.outputs.version }}" --dir released

      - name: 🔐 Verify checksums, signature, tag, and proof binding
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          RELEASE_TARGET_SHA: ${{ needs.validate-build.outputs.release_target_sha }}
        shell: bash
        run: |
          (cd released && sha256sum -c "terraform-provider-pyvider_${{ needs.release.outputs.version }}_SHA256SUMS")
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --verify \
            "released/terraform-provider-pyvider_${{ needs.release.outputs.version }}_SHA256SUMS.sig" \
            "released/terraform-provider-pyvider_${{ needs.release.outputs.version }}_SHA256SUMS"
          tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${{ needs.release.outputs.version }}" --jq .object.sha)
          tag_type=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${{ needs.release.outputs.version }}" --jq .object.type)
          if [ "$tag_type" = tag ]; then
            tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/$tag_sha" --jq .object.sha)
          fi
          test "$tag_sha" = "$RELEASE_TARGET_SHA"
          mkdir -p released/dist/linux_amd64
          unzip -oq "released/terraform-provider-pyvider_${{ needs.release.outputs.version }}_linux_amd64.zip" \
            -d released/dist/linux_amd64
          cp released/provider-linting-build-provenance.json released/dist/
          uv run python - "$RELEASE_TARGET_SHA" <<'PY'
          import hashlib, json, pathlib, sys
          root = pathlib.Path("released")
          proof = json.loads((root / "provider-linting-proof.json").read_text(encoding="utf-8"))
          build = json.loads((root / "provider-linting-build-provenance.json").read_text(encoding="utf-8"))
          assert build["provider_repository_head"] == sys.argv[1]
          assert build["release_candidate"]["platform"] == "linux_amd64"
          binary = root / build["artifacts"]["binary"]["path"]
          assert hashlib.sha256(binary.read_bytes()).hexdigest() == build["artifacts"]["binary"]["sha256"]
          assert proof["components"]["terraform-provider-pyvider"]["sha"] == sys.argv[1]
          assert proof["provider_binary"]["sha256"] == build["artifacts"]["binary"]["sha256"]
          assert proof["provider_binary"]["platform"] == "linux_amd64"
          assert proof["release_candidate"] == build["release_candidate"]
          for name in ("pyvider", "pyvider-components"):
              dependency = build["dependencies"][name]
              component = proof["components"][name]
              assert component["sha"] == dependency["commit"]
              assert component["wheel_sha256"] == dependency["sha256"]
          PY

      - name: 🪣 Install pinned OpenTofu beta
        shell: bash
        run: |
          tofu=$(ci/install-opentofu-beta.sh --version 1.13.0-beta1 --cache-dir "$PWD/.cache/opentofu-beta")
          echo "PYVIDER_OPENTOFU_BINARY=$tofu" >> "$GITHUB_ENV"

      - name: 🧪 Re-run the released linux_amd64 proof
        shell: bash
        run: |
          binary="$PWD/released/dist/linux_amd64/terraform-provider-pyvider_v${{ needs.release.outputs.version }}"
          chmod +x "$binary"
          make test-conformance-binary PYVIDER_CONFORMANCE_PSP="$binary"
          make test-linting-opentofu-binary PYVIDER_CONFORMANCE_PSP="$binary" \
            PYVIDER_OPENTOFU_BINARY="$PYVIDER_OPENTOFU_BINARY"
          uv run python ci/verify-provider-linting-proof.py \
            "$PWD/released/provider-linting-proof.json" \
            "$PWD/released/provider-linting-opentofu.cast" \
            "$PWD/released/provider-linting-direct.cast" \
            "$PWD/released/provider-linting-walkthrough.cast"
