name: 🚀 Release Provider

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Exact successful build workflow run ID for this commit
        required: true
        type: string
      prerelease:
        description: Is this a pre-release?
        required: false
        type: boolean
        default: false

env:
  PYTHON_VERSION: '3.11'
  PYTHONIOENCODING: utf-8

jobs:
  validate-build:
    name: 🔒 Validate exact build run
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      build_run_id: ${{ steps.validate.outputs.build_run_id }}
      release_target_sha: ${{ steps.validate.outputs.release_target_sha }}
    steps:
      - name: Validate numeric run and exact release commit
        id: validate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          RELEASE_TARGET_SHA: ${{ github.sha }}
        run: |
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'build_run_id must be numeric' >&2; exit 2; }
          [[ "$RELEASE_TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'github.sha must be a full commit SHA' >&2; exit 2; }
          run_json=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BUILD_RUN_ID}")
          test "$(jq -r .path <<<"$run_json")" = ".github/workflows/build-provider.yml"
          test "$(jq -r .conclusion <<<"$run_json")" = "success"
          headSha=$(jq -r .head_sha <<<"$run_json")
          test "$headSha" = "$RELEASE_TARGET_SHA"
          artifacts=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BUILD_RUN_ID}/artifacts")
          for required in \
            provider-linux_amd64 provider-linux_arm64 provider-darwin_amd64 \
            provider-darwin_arm64 provider-windows_amd64 provider-linting-proof; do
            jq -e --arg name "$required" '.artifacts[] | select(.name == $name and .expired == false)' \
              <<<"$artifacts" >/dev/null
          done
          echo "build_run_id=$BUILD_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "release_target_sha=$RELEASE_TARGET_SHA" >> "$GITHUB_OUTPUT"

  release:
    name: 🎉 Publish exact-SHA release
    needs: validate-build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: 📥 Checkout exact release target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.validate-build.outputs.release_target_sha }}

      - name: 📖 Read version
        id: version
        shell: bash
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: 📥 Download all artifacts from the validated run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: artifacts
          run-id: ${{ needs.validate-build.outputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Copy the validated run's platform archives, proof assets, and registry
      # manifest into release/, refusing a build that is missing any of them.
      - name: 📁 Stage release archives and proof assets
        shell: bash
        run: ci/stage-release-assets.sh artifacts release "${{ steps.version.outputs.version }}"

      - name: 🔧 Generate release checksums
        shell: bash
        run: |
          cd release
          sha256sum * > "terraform-provider-pyvider_${{ steps.version.outputs.version }}_SHA256SUMS"
          sha256sum -c "terraform-provider-pyvider_${{ steps.version.outputs.version }}_SHA256SUMS"

      - name: 🔐 Sign and verify checksums
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          test -n "$GPG_PRIVATE_KEY"
          test -n "$GPG_KEY_ID"
          .github/scripts/sign-release.sh release
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --verify \
            "release/terraform-provider-pyvider_${{ steps.version.outputs.version }}_SHA256SUMS.sig" \
            "release/terraform-provider-pyvider_${{ steps.version.outputs.version }}_SHA256SUMS"

      - name: 🎉 Publish release at the validated SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TARGET_SHA: ${{ needs.validate-build.outputs.release_target_sha }}
        run: ci/publish-release.sh "${{ steps.version.outputs.version }}"

  # Verify the published bytes and re-run the proof against the released binary.
  verify-release-proof:
    name: 🔎 verify-release-proof
    needs: [validate-build, release]
    permissions:
      contents: read
    uses: ./.github/workflows/verify-release.yml
    with:
      version: ${{ needs.release.outputs.version }}
      release_target_sha: ${{ needs.validate-build.outputs.release_target_sha }}
    secrets: inherit
