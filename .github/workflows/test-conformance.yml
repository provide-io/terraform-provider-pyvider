name: 🧪 Provider Conformance Tests

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Build workflow run ID (required)'
        required: true
        type: string
  workflow_run:
    workflows: ["🏗️ Build Provider Binary"]
    types:
      - completed

env:
  PYTHON_VERSION: '3.11'
  PYTHONIOENCODING: utf-8

jobs:
  # Check if we should run tests (skip if workflow_run failed)
  check:
    name: 🔍 Check Build Status
    runs-on: ubuntu-24.04
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      build_run_id: ${{ steps.check.outputs.build_run_id }}

    steps:
      - name: 📋 Determine build run ID
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            BUILD_RUN_ID="${{ github.event.workflow_run.id }}"
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "build_run_id=${BUILD_RUN_ID}" >> $GITHUB_OUTPUT
            echo "✅ Running tests with artifacts from build workflow run: ${BUILD_RUN_ID}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.build_run_id }}" ]]; then
            BUILD_RUN_ID="${{ inputs.build_run_id }}"
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "build_run_id=${BUILD_RUN_ID}" >> $GITHUB_OUTPUT
            echo "✅ Running tests with artifacts from specified build run: ${BUILD_RUN_ID}"
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "❌ ERROR: This workflow requires artifacts from the Build Provider Binary workflow"
            exit 1
          fi

  conformance:
    name: 🧪 Test ${{ matrix.target }} (${{ matrix.engine }})
    needs: check
    if: needs.check.outputs.should_run == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Both engines, every platform the build produces.
        #
        # Only Terraform has a `query` command, and it is the only path that
        # reaches a list resource; OpenTofu has no `action` or `state_store`
        # block at any version, 1.13.0-beta1 included. Running one engine could
        # not see what the other refuses, and this suite ran OpenTofu alone.
        #
        # linux_arm64 and darwin_amd64 were built, zipped and released without
        # ever being tested. They are here now.
        #
        # windows_arm64 is still absent, and correctly: grpcio publishes no
        # win_arm64 wheel (grpc/grpc#39064, still true at 1.83.1), so the
        # provider cannot be built for it in the first place.
        engine: [tofu, terraform]
        target: [linux_amd64, linux_arm64, darwin_arm64, darwin_amd64, windows_amd64]
        include:
          - target: linux_amd64
            os: ubuntu-24.04
            platform: linux
            arch: amd64
          - target: linux_arm64
            os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - target: darwin_arm64
            os: macos-15
            platform: darwin
            arch: arm64
          - target: darwin_amd64
            os: macos-15-intel
            platform: darwin
            arch: amd64
          - target: windows_amd64
            os: windows-2025
            platform: windows
            arch: amd64

    runs-on: ${{ matrix.os }}
    # No continue-on-error. Windows ran non-gating on both this job and the
    # build, so a Windows-only regression reported success and shipped. It
    # passes today -- every step of the last run, checked individually rather
    # than read off the job's own (meaningless, under continue-on-error)
    # conclusion -- so there is nothing to suppress.
    env:
      TF_BIN: ${{ matrix.engine }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 📖 Read VERSION
        id: version
        shell: bash
        run: |
          VERSION=$(cat VERSION)
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "🧪 Testing version: ${VERSION}"

      - name: 📥 Download provider artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: provider-${{ matrix.target }}
          path: provider-binary
          run-id: ${{ needs.check.outputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}

      - name: 📦 Extract provider binary
        shell: bash
        run: |
          cd provider-binary
          echo "📦 Contents of provider-binary directory:"
          ls -la
          echo ""

          echo "📦 Extracting provider archive..."
          unzip terraform-provider-pyvider_${{ steps.version.outputs.VERSION }}_${{ matrix.target }}.zip

          # Determine binary name
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            BINARY="terraform-provider-pyvider_v${{ steps.version.outputs.VERSION }}.exe"
          else
            BINARY="terraform-provider-pyvider_v${{ steps.version.outputs.VERSION }}"
          fi

          chmod +x "$BINARY" 2>/dev/null || true

          echo ""
          echo "✅ Extracted provider binary:"
          ls -la "$BINARY"

      - name: 🔍 Verify provider binary
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            PROVIDER_BINARY="provider-binary/terraform-provider-pyvider_v${{ steps.version.outputs.VERSION }}.exe"
          else
            PROVIDER_BINARY="provider-binary/terraform-provider-pyvider_v${{ steps.version.outputs.VERSION }}"
          fi

          echo "════════════════════════════════════════════════════════════════"
          echo "🔍 PROVIDER BINARY VERIFICATION"
          echo "════════════════════════════════════════════════════════════════"
          echo ""

          echo "📋 Binary information:"
          ls -lah "$PROVIDER_BINARY"
          echo ""

          echo "📋 File type:"
          file "$PROVIDER_BINARY" || echo "file command not available"
          echo ""

          if [[ "${{ matrix.platform }}" == "linux" ]]; then
            echo "📋 Library dependencies (ldd):"
            ldd "$PROVIDER_BINARY" 2>&1 || echo "ldd not available or binary not dynamically linked"
          elif [[ "${{ matrix.platform }}" == "darwin" ]]; then
            echo "📋 Library dependencies (otool):"
            otool -L "$PROVIDER_BINARY" 2>&1 || echo "otool not available"
          fi
          echo ""

          echo "📋 Testing provider executable (launch-context):"
          timeout 10 "$PROVIDER_BINARY" launch-context 2>&1 | head -10 || true
          echo "✅ Provider binary is valid"

          echo ""
          echo "✅ Provider binary verification complete"
          echo "════════════════════════════════════════════════════════════════"

      - name: 🔌 Install provider to Terraform plugin directory
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            SOURCE="provider-binary/terraform-provider-pyvider_v${{ steps.version.outputs.VERSION }}.exe"
          else
            SOURCE="provider-binary/terraform-provider-pyvider_v${{ steps.version.outputs.VERSION }}"
          fi
          chmod +x .github/scripts/install-provider.sh
          .github/scripts/install-provider.sh \
            "${{ steps.version.outputs.VERSION }}" \
            "${{ matrix.target }}" \
            "$SOURCE"

      # `latest` for both, deliberately. An undated pin rots: 1.10.6 predated
      # write-only attributes and failed pyvider_secret_note with "Provider
      # produced invalid plan" for a provider behaving exactly as write-only
      # requires. Examples that need a particular version say so themselves, in
      # their requirements sidecar, which is where a version floor belongs.
      #
      # The wrapper is off in both cases: it intercepts stdout, which stir
      # parses.
      - name: 📝 Install OpenTofu
        if: matrix.engine == 'tofu'
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: latest
          tofu_wrapper: false

      - name: 📝 Install Terraform
        if: matrix.engine == 'terraform'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest
          terraform_wrapper: false

      - name: 🐍 Setup Python
        if: env.ACT != 'true' && github.actor != 'nektos/act'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install UV (for tofusoup)
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: 🍲 Install tofusoup
        shell: bash
        run: |
          uv tool install tofusoup
          echo "✅ Tofusoup installed"
          soup --version

      # The four steps below were 150 lines of inline bash with `tofu` hard
      # coded throughout. They live in ci/conformance.sh now, which takes the
      # engine from TF_BIN -- one subcommand per step, so the CI UI still shows
      # which one failed.
      - name: "🔥 Smoke Test 1: Production Mode (Minimal Config)"
        shell: bash
        run: ci/conformance.sh smoke-production

      - name: "🔥 Smoke Test 2: Test Mode Rejection (WITHOUT PYVIDER_TESTMODE)"
        shell: bash
        env:
          PYVIDER_PRIVATE_STATE_SHARED_SECRET: "test-secret-for-ci-only-not-production"
        run: ci/conformance.sh smoke-testmode-rejected

      - name: "🔥 Smoke Test 3: Test Mode Success (WITH PYVIDER_TESTMODE)"
        shell: bash
        env:
          PYVIDER_TESTMODE: true
          PYVIDER_PRIVATE_STATE_SHARED_SECRET: "test-secret-for-ci-only-not-production"
        run: ci/conformance.sh smoke-testmode-ok

      - name: 🧪 Run Full Conformance Tests
        shell: bash
        env:
          TF_LOG: DEBUG
          PYVIDER_TESTMODE: true
          PYVIDER_PRIVATE_STATE_SHARED_SECRET: "test-secret-for-ci-only-not-production"
        run: ci/conformance.sh full

      # Record the conformance suite as an asciinema cast (Linux only).
      # Uses Python's pty module — no external asciinema binary required.
      # One leg records it: the artifact name is fixed, and four linux legs
      # (two targets x two engines) would race for it.
      - name: 🎬 Record conformance cast
        if: matrix.target == 'linux_amd64' && matrix.engine == 'tofu'
        shell: bash
        env:
          PYVIDER_TESTMODE: true
          PYVIDER_PRIVATE_STATE_SHARED_SECRET: "test-secret-for-ci-only-not-production"
        run: ci/record-conformance.sh

      # Upload the cast file so site-pyvider-com can fetch it as a build artifact.
      - name: 📤 Upload conformance cast
        if: matrix.target == 'linux_amd64' && matrix.engine == 'tofu'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: conformance-cast
          path: conformance.cast
          retention-days: 90
          if-no-files-found: error

      - name: 📤 Upload test logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: conformance-test-logs-${{ matrix.target }}-${{ matrix.engine }}
          path: |
            examples/**/.soup/logs/*.log
            examples/**/.soup/logs/terraform.log
            examples/**/.terraform.lock.hcl
            examples/**/terraform.tfstate*
            /tmp/smoke-test-production/.terraform/
            /tmp/smoke-test-production/terraform.tfstate*
            /tmp/smoke-test-production/.terraform.lock.hcl
            /tmp/testmode-*.log
            examples/resource/private_state_verifier/.terraform/
            examples/resource/private_state_verifier/terraform.tfstate*
            examples/resource/private_state_verifier/.terraform.lock.hcl
          # Every path above is a dot-path -- .soup, .terraform,
          # .terraform.lock.hcl -- and upload-artifact skips hidden files
          # unless told otherwise, so without this the artifact carries none of
          # the logs it exists to carry.
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

  # tests/conformance drives the packaged binary over tfplugin6 directly. It
  # existed, fully written, and nothing ran it: 87 tests covering the RPCs no
  # example reaches -- state-store locking across two provider processes,
  # chunked writes reassembled byte-for-byte, identity round-trips, action
  # deferral. Its conftest already carries PYVIDER_CONFORMANCE_REQUIRED for
  # exactly this job.
  #
  # No engine is involved, so this is one leg per platform rather than per
  # (platform, engine) pair.
  protocol:
    name: 🔬 Protocol ${{ matrix.target }}
    needs: check
    if: needs.check.outputs.should_run == 'true'
    strategy:
      fail-fast: false
      matrix:
        target: [linux_amd64, linux_arm64, darwin_arm64, darwin_amd64, windows_amd64]
        include:
          - target: linux_amd64
            os: ubuntu-24.04
            platform: linux
          - target: linux_arm64
            os: ubuntu-24.04-arm
            platform: linux
          - target: darwin_arm64
            os: macos-15
            platform: darwin
          - target: darwin_amd64
            os: macos-15-intel
            platform: darwin
          - target: windows_amd64
            os: windows-2025
            platform: windows

    runs-on: ${{ matrix.os }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The binary is named for the version, so the tests need it too.
      - name: 📖 Read VERSION
        id: version
        shell: bash
        run: echo "VERSION=$(cat VERSION)" >> $GITHUB_OUTPUT

      # Same artifact the conformance job consumes, from the build that
      # triggered this run.
      - name: 📥 Download provider artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: provider-${{ matrix.target }}
          path: provider-binary
          run-id: ${{ needs.check.outputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}

      # Unpack and mark executable; the zip carries no permission bits on
      # Windows runners.
      - name: 📦 Extract provider binary
        shell: bash
        run: ci/extract-provider.sh "${{ steps.version.outputs.VERSION }}" "${{ matrix.target }}" "${{ matrix.platform }}"

      - name: 🐍 Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 📦 Set up uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0

      # The suite imports tofusoup.tfplugin as its driver and pyvider for the
      # protobuf definitions, both of which are already dev dependencies.
      - name: 📦 Install test dependencies
        shell: bash
        run: uv sync --extra dev

      - name: 🔬 Run protocol conformance tests
        shell: bash
        run: ci/protocol-tests.sh "$(cat provider-binary/BINARY_PATH)"

  summary:
    name: 📋 Test Summary
    needs: [check, conformance, protocol]
    if: always() && needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-24.04

    steps:
      # Both jobs are reported and both gate the result. Reading only one of
      # them would let the other fail silently, which is the whole reason this
      # summary exists.
      - name: 📊 Generate Summary
        env:
          CONFORMANCE_RESULT: ${{ needs.conformance.result }}
          PROTOCOL_RESULT: ${{ needs.protocol.result }}
        run: ci/conformance-summary.sh
