name: 🏗️ Build Provider Binary

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      upload_retention_days:
        description: Artifact retention days
        required: false
        type: number
        default: 7
      provider_linting_proof:
        description: Build and verify the provider-linting proof artifact
        required: false
        type: boolean
        default: false

concurrency:
  group: build-provider-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: '3.11'
  PYTHONIOENCODING: utf-8
  PYVIDER_VERSION: '0.8.1'
  COMPONENTS_VERSION: '0.8.0'

jobs:
  build:
    name: 📦 Build for ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson((github.actor == 'nektos/act') && '{"include":[{"os":"ubuntu-24.04","target":"linux_amd64"}]}' || '{"include":[{"os":"ubuntu-24.04","target":"linux_amd64"},{"os":"ubuntu-24.04-arm","target":"linux_arm64"},{"os":"macos-15","target":"darwin_arm64"},{"os":"macos-15-intel","target":"darwin_amd64"},{"os":"windows-2025","target":"windows_amd64"}]}') }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 🐍 Setup Python
        if: env.ACT != 'true' && github.actor != 'nektos/act'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install UV
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: false

      - name: 🔧 Install build dependencies
        shell: bash
        run: uv sync --frozen --group dev

      - name: 🏗️ Build public-dependency release candidate once
        shell: bash
        run: |
          uv run python ci/build-provider-linting-stack.py \
            --provider-repository . \
            --pyvider-version "$PYVIDER_VERSION" \
            --components-version "$COMPONENTS_VERSION" \
            --output-dir dist
          test -f "dist/terraform-provider-pyvider_$(cat VERSION)_${{ matrix.target }}.zip"

      - name: 🔒 Require artifact platform identity
        shell: bash
        run: |
          uv run python - "${{ matrix.target }}" <<'PY'
          import json, pathlib, sys
          provenance = json.loads(pathlib.Path("dist/provider-linting-build-provenance.json").read_text(encoding="utf-8"))
          assert provenance["schema_version"] == 2
          assert provenance["release_candidate"]["platform"] == sys.argv[1]
          assert provenance["release_candidate"]["github_artifact"] == f"provider-{sys.argv[1]}"
          assert provenance["artifacts"]["binary"]["platform"] == sys.argv[1]
          PY

      - name: 📤 Upload required provider artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: provider-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: ${{ inputs.upload_retention_days || 7 }}

  conformance:
    name: 🧪 Conformance
    needs: build
    uses: ./.github/workflows/test-conformance.yml
    permissions:
      contents: read
      actions: read
    secrets: inherit

  provider-linting-proof:
    name: 🔎 Provider linting proof
    if: github.event_name == 'workflow_dispatch' && inputs.provider_linting_proof
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read

    steps:
      - name: 📥 Checkout provider
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 🐍 Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install UV
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: false

      - name: 📥 Download this run's linux_amd64 release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: provider-linux_amd64
          path: dist

      - name: 🔏 Verify public wheels and release-candidate bytes
        shell: bash
        run: |
          archive="dist/terraform-provider-pyvider_$(cat VERSION)_linux_amd64.zip"
          uv run python - "$archive" <<'PY'
          import hashlib, json, pathlib, sys
          root = pathlib.Path("dist")
          provenance = json.loads((root / "provider-linting-build-provenance.json").read_text(encoding="utf-8"))
          archive = pathlib.Path(sys.argv[1])
          assert provenance["release_candidate"]["github_artifact"] == "provider-linux_amd64"
          assert provenance["release_candidate"]["platform"] == "linux_amd64"
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == provenance["release_candidate"]["sha256"]
          for name in ("pyvider", "pyvider-components"):
              dependency = provenance["dependencies"][name]
              assert dependency["registry"] == "https://pypi.org/simple"
              assert len(dependency["sha256"]) == 64
          PY
          unzip -oq "$archive" -d dist/linux_amd64
          lint_binary="$PWD/dist/linux_amd64/terraform-provider-pyvider_v$(cat VERSION)"
          test -x "$lint_binary"
          echo "PYVIDER_CONFORMANCE_PSP=$lint_binary" >> "$GITHUB_ENV"

      - name: 🪣 Install pinned OpenTofu prerelease
        shell: bash
        run: |
          install_log=$(mktemp)
          tofu=$(ci/install-opentofu-experimental.sh \
            --version 1.13.0-rc1 --cache-dir "$PWD/.cache/opentofu-prerelease" 2>"$install_log")
          archive_sha=$(awk '/^verified [0-9a-f]{64}$/ { print $2 }' "$install_log")
          [[ "$archive_sha" =~ ^[0-9a-f]{64}$ ]]
          "$tofu" version | grep -Fxq 'OpenTofu v1.13.0-rc1'
          echo "PYVIDER_OPENTOFU_BINARY=$tofu" >> "$GITHUB_ENV"
          echo "PYVIDER_OPENTOFU_ARCHIVE_SHA256=$archive_sha" >> "$GITHUB_ENV"

      - name: 🍲 Install released TofuSoup and proof dependencies
        run: |
          uv tool install --refresh tofusoup==0.8.2
          uv sync --frozen --group dev
          test "$(soup --version)" = "soup, version 0.8.2"
          uv run python -c 'import tofusoup; assert tofusoup.__version__ == "0.8.2"'

      - name: 🧪 Prove the downloaded binary through both lanes
        run: |
          before=$(shasum -a 256 "$PYVIDER_CONFORMANCE_PSP" | awk '{print $1}')
          make test-conformance-binary PYVIDER_CONFORMANCE_PSP="$PYVIDER_CONFORMANCE_PSP"
          make test-linting-opentofu-binary PYVIDER_CONFORMANCE_PSP="$PYVIDER_CONFORMANCE_PSP" \
            PYVIDER_OPENTOFU_BINARY="$PYVIDER_OPENTOFU_BINARY"
          test "$(shasum -a 256 "$PYVIDER_CONFORMANCE_PSP" | awk '{print $1}')" = "$before"

      - name: 🎬 Record and verify checked proof
        run: |
          PYVIDER_CONFORMANCE_PSP="$PYVIDER_CONFORMANCE_PSP" ci/record-provider-linting.sh
          uv run python ci/verify-provider-linting-proof.py \
            provider-linting-proof.json provider-linting-opentofu.cast \
            provider-linting-direct.cast provider-linting-walkthrough.cast
          uv run pytest tests/proof -q

      - name: 📤 Upload checked provider linting proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: provider-linting-proof
          path: |
            provider-linting-opentofu.cast
            provider-linting-direct.cast
            provider-linting-walkthrough.cast
            provider-linting-proof.json
            dist/provider-linting-build-provenance.json
          if-no-files-found: error
          retention-days: ${{ inputs.upload_retention_days || 7 }}

  summary:
    name: 📋 Build Summary
    needs: [build, conformance]
    runs-on: ubuntu-24.04
    steps:
      - name: 📊 Summary
        run: |
          echo '## Provider release candidates built' >> "$GITHUB_STEP_SUMMARY"
          echo 'Linux amd64/arm64, Darwin amd64/arm64, and required Windows amd64 artifacts passed the build.' >> "$GITHUB_STEP_SUMMARY"
