# Applies to every example of this component: each one calls the live
# httpbin.org, so they fail closed on an air-gapped runner and are at the mercy
# of a third party's uptime. A failure here is not necessarily a defect in the
# provider.
#
# They also record how long each call took, and a measured duration is
# different on every read, so the re-plan after a successful apply legitimately
# shows a diff. That is what `converges = false` is for: the values are real
# observations, not a provider inventing something during apply.
[requirements]
network = ["httpbin.org"]
converges = false
reason = "the examples call the live httpbin.org service and record its response times"
