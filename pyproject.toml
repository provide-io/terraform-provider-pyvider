#
# terraform-provider-pyvider
#
# The official Pyvider provider, built with Pyvider
#

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terraform-provider-pyvider"
dynamic = ["version"]
description = "The official Pyvider provider, built with Pyvider."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Tim Perkins", email = "code@tim.life" }
]
maintainers = [
    { name = "provide.io", email = "code@provide.io" }
]
keywords = ["terraform", "provider", "pyvider", "opentofu", "infrastructure"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    # Floors track the suite releases this provider is built and tested against.
    #
    # pyvider 0.7.0 is the wire contract these examples and the conformance
    # suite assert against: the a_obj nested_type encoding, the declarations
    # that are hard errors rather than inert, and a dev-mode wrapper that leaves
    # the working directory alone, so a relative path an example passes -- and
    # the filesystem state store's default root -- resolves against the caller
    # rather than this checkout.
    #
    # pyvider-components 0.7.1 names the file-content resource and its list
    # resource `pyvider_file_content`, which tests/conformance asserts: an older
    # resolution publishes `pyvider_directory_entry` and fails the list-resource
    # suite. 0.7.1 is also where both actions defer only for the reason
    # Terraform accepts, so 0.7.0 paired with pyvider 0.7.0 answers PlanAction
    # with an error diagnostic instead of a plan.
    "provide-foundation>=0.4.4",
    "pyvider>=0.7.0",
    "pyvider-components>=0.7.1",
    # Capped below 1.11 for the packaged build, not for this package's own use.
    # flavorpack downloads wheels with --platform manylinux2014_<arch> (its
    # MANYLINUX_TAG is hardcoded), and jq stopped publishing manylinux2014
    # wheels after 1.10.0 -- 1.11 and 1.12 ship manylinux_2_26/2_28 only. With
    # jq 1.12.0 in the lock, pip on the Linux runners reports "from versions:
    # ... 1.10.0" and the PSP build fails outright. Lift this once flavorpack
    # asks for a newer tag.
    "jq>=1.9.1,<1.11; sys_platform != 'win32' or platform_machine != 'ARM64'",
    # Floor only. The previous <=46.0.3 cap applied to win32/ARM64, a platform
    # the suite cannot install on at all, so it constrained a resolution that
    # never happens.
    #
    # Measured 2026-08-31 against PyPI, over all 61 pinned runtime requirements
    # at CPython 3.11: 50 are pure Python and 7 of the 11 compiled ones publish
    # win_arm64 wheels (cffi, markupsafe, msgpack, psutil via cp37-abi3,
    # pyjson5, zstandard). These four do not:
    #
    #   grpcio 1.83.1        no win_arm64 wheel in any release; win_amd64 and
    #                        win32 only. grpc/grpc#39064.
    #   cryptography 50.0.1  no win_arm64 -- and this is a regression, not a
    #                        gap: 46.0.0 through 46.0.3 shipped
    #                        cp311-abi3-win_arm64 and 46.0.4 dropped it.
    #   setproctitle 1.3.7   no win_arm64 wheel in any release (via
    #                        provide-foundation).
    #   jq 1.10.0            no win_arm64 wheel in any release, which is what
    #                        the marker on the requirement above is for.
    #
    # pyyaml is a fifth constraint of a different kind: 6.0.3 is its first
    # release with win_arm64 wheels and they are cp312 and up, so win_arm64
    # would also mean moving the packaged interpreter off 3.11.
    #
    # grpcio is the binding one. pyvider requires it unconditionally, so no
    # marker or floor routes around it: every other blocker could be fixed and
    # windows_arm64 would still be unsupported suite-wide.
    "cryptography>=46.0.0; sys_platform == 'win32' and platform_machine == 'ARM64'",
]

[dependency-groups]
dev = [
    "provide-testkit[standard,build]>=0.4.5",
    "flavorpack>=0.4.6",
    "plating>=0.6.1",
    # provide-foundry>=0.4.0 isn't on PyPI; docs.setup needs it for extract_base_mkdocs
    "provide-foundry>=0.4.0",
    # Drives the packaged provider over tfplugin6 for the conformance suite.
    "tofusoup>=0.6.0",
    # Bounds the conformance suite: see timeout_method in [tool.pytest.ini_options].
    "pytest-timeout>=2.3.1",
    "ty>=0.0.8",
]
docs = [
    "provide-testkit[docs]>=0.4.5",
]

[project.urls]
Homepage = "https://github.com/provide-io/terraform-provider-pyvider"
Repository = "https://github.com/provide-io/terraform-provider-pyvider"
Documentation = "https://foundry.provide.io/terraform-provider-pyvider"
Issues = "https://github.com/provide-io/terraform-provider-pyvider"

[project.scripts]
terraform-provider-pyvider = "pyvider.cli:main"

[tool.setuptools]
py-modules = []
packages = []

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.ruff]
line-length = 111
indent-width = 4
target-version = "py311"
# ruff >=0.16 formats Python code blocks embedded in Markdown, so the generated
# documentation would be restyled on every run.
#
# `.ci-tooling` is another repository, checked out into the workspace by CI. Its
# docs are not ours to restyle either, and `ruff format .` -- which is what the
# wrknv `format.check` task runs, unlike the scoped invocation used locally --
# walks into it and fails the Code Quality job on files this repository does not
# own.
extend-exclude = ["**/*.md", ".ci-tooling"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "ANN", "B", "C90", "SIM", "PTH", "RUF"]
ignore = ["ANN401", "E501"]

[tool.ruff.lint.per-file-ignores]
# ci/ helper scripts use stdlib open() and dense if-else; relax rule set here.
"ci/*.py" = ["PTH123", "SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["pyvider", "tests"]
force-sort-within-sections = true
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
pretty = true
show_error_codes = true
warn_unused_ignores = true
# Don't descend into virtualenvs or build artifacts.
exclude = ["^(workenv|\\.venv|build|dist)/"]

[[tool.mypy.overrides]]
module = ["pyvider.*", "flavorpack.*", "plating.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = [
    "conformance: drives the packaged provider binary over tfplugin6",
]
# A healthy conformance run is ~6s for 87 tests, so 300s only ever fires on a
# genuine hang -- and one has been seen: the suite stalled 22 minutes at ~0% CPU
# with the main thread blocked in a synchronous read-to-EOF inside the asyncio
# event loop, waiting on a provider that never accepted a connection.
#
# timeout_method is "thread" rather than the default "signal" on purpose. Signal
# does interrupt a blocking read on the main thread (checked), but it only ever
# interrupts the main thread, and in that stall two further threads were parked
# reading the provider's stdout and stderr. The watchdog thread fires wherever
# the process is stuck and dumps every thread's stack on the way out, which is
# what identified the blocking read in the first place.
timeout = 300
timeout_method = "thread"
# Parallel execution: pytest -n <workers> (range: 2-16, recommend: CPU cores or 8, max: 16 to avoid xdist hang)

[tool.coverage.run]
branch = true
source = ["."]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "def __repr__",
    "def __str__",
    "pass",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"
[tool.flavor]
entry_point = "pyvider.cli:main"
output_path = "dist/terraform-provider-pyvider"

[tool.flavor.metadata]
package_name = "terraform-provider-pyvider"

[tool.flavor.build]
# No `dependencies` key. flavorpack joins each entry onto the manifest
# directory and builds a wheel from it, so it takes filesystem paths and
# nothing else -- requirement strings like "pyvider-components>=0.5.2" have
# only ever produced `⚠️ Local dependency not found` at every build since
# 602ebab. The runtime tree comes from `build_and_resolve_project`, which reads
# the lock, so there was nothing for these to add.
exclude = [
    "**/.terraform/**",
    "**/.venv/**", 
    "**/__pycache__/**",
    "**/*.pyc",
    "**/*.pyo",
    "**/.DS_Store",
]
# The oldest Linux this provider is built to run on, stated rather than
# implied. `pip download --platform TAG` replaces the set of tags pip will
# consider and expands each one downward only, so this is both the floor the
# artifact promises (glibc 2.17: CentOS 7, Amazon Linux 2) and the ceiling on
# what a bundled wheel may require.
#
# Listing manylinux2014 alone is deliberate. flavorpack's default also offers
# manylinux_2_28 as a fallback, which lets a package that has stopped
# publishing 2_17 wheels resolve anyway -- convenient, but it silently raises
# the artifact's real floor to whatever that package needs. jq is exactly that
# case: from 1.11 it ships manylinux_2_26/2_28 only, so accepting the fallback
# would produce a provider whose jq extension cannot load on CentOS 7 while
# the build still went green.
#
# With the floor declared here, that combination fails at build time instead,
# naming the tags it asked for. Widen this list only as a deliberate decision
# to stop supporting the older distributions.
manylinux = ["manylinux2014"]

[tool.flavor.signing]
private_key_path = "keys/provider-private.key"
public_key_path = "keys/provider-public.key"

[tool.flavor.execution]
# {python_bin} expands at runtime: {workenv}/Scripts/python.exe (Windows)
#                                   {workenv}/bin/python3 (Unix/macOS)
command = "{python_bin} -m pyvider.cli"

[tool.flavor.execution.runtime]
[tool.flavor.execution.runtime.env]
# Pass through all Terraform, Pyvider, and Foundation environment variables as-is
pass = ["TF_*", "PLUGIN_*", "PYVIDER_*", "PROVIDE_*", "FOUNDATION_*"]

[tool.bandit]
exclude_dirs = [".venv", "tests", "workenv"]

################################################################################
# codespell
################################################################################

[tool.codespell]
skip = "docs/js/termynal.js,docs/css/termynal.css,.venv,workenv,*.lock"
ignore-words-list = "ines"

################################################################################
# Security Scanning Allowlist
################################################################################

[tool.security]
# Paths to exclude from secret scanning (TruffleHog, GitGuardian, Gitleaks)
description = "Documentation, examples, and build artifacts - intentionally committed"
allowed_paths = [
    # Generated documentation with example HCL
    "docs/**",
    # Terraform examples with test tfplan files
    "examples/**",
    # Test signing keys for provider development
    "keys/**",
    # Flavorpack workenv build artifacts
    "workenv/**",
    # GitHub bot private keys (legacy, in git history)
    "*.private-key.pem",
]

[tool.pyvider]
# Provider metadata. The name selects the plugin directory Terraform searches,
# local/providers/<name>/. `name` is the documented key as of pyvider 0.6.1,
# which the floor above clears -- 0.6.0 read only `provider_name`, so a
# resolution at that version would find no name here and fall back to the
# default. `provider_name` is still accepted as an alias.
name = "pyvider"
# Component packages to use for this provider
component_packages = ["pyvider.components"]
